[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Single Railway service: web API + embedded worker (no dedicated worker yet).
# When you add a separate worker service, switch this to `npm start` and point
# the worker service at railway.worker.json with PROCESS_ROLE=worker.
startCommand = "npm run start:production"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"

# Recommended env (Railway dashboard):
# PROCESS_ROLE=web
# WORKER_CONCURRENCY=2
# PG_POOL_MAX=5
# NODE_OPTIONS=--max-old-space-size=768
# DATABASE_URL=<Railway Postgres>
# CLIENT_URL=https://app.fbuploadplus.com
# Allocate ≥1 GB RAM (ffmpeg/yt-dlp).
#
# Split services later:
# 1. Web: startCommand npm start, PROCESS_ROLE=web, config railway.toml
# 2. Worker: config railway.worker.json, PROCESS_ROLE=worker, same DATABASE_URL + R2
