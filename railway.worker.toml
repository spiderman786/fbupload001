[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run worker"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"

# Recommended Railway worker variables (also auto-defaulted in code for PROCESS_ROLE=worker):
# PROCESS_ROLE=worker
# WORKER_CONCURRENCY=3
# WORKER_POLL_MS=2000
# PREFILL_STARTUP_DELAY_MS=45000
# Use at least 1–2 GB RAM on the worker service for ffmpeg/yt-dlp jobs.
#
# Multi-replica: use railway.worker.json as the worker service config file.
# Set multiRegionConfig region to match your Railway project (default us-west2).
# Each replica gets RAILWAY_REPLICA_ID / RAILWAY_REPLICA_REGION automatically.
